[package]
name = "hush-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
libsignal-protocol.workspace = true
rusqlite = { version = "0.32", features = ["bundled"] }
async-trait = "0.1"
chacha20poly1305 = "0.10"
data-encoding = "2"
# rustls rather than the platform's TLS: native-tls drags in OpenSSL when
# cross-compiling to Android, and one TLS stack everywhere is one less thing
# that behaves differently per platform.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls",
    "charset",
    "http2",
] }
tokio-stream = "0.1"
futures-util = "0.3"
bytes = "1"
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
rand.workspace = true
base64.workspace = true
tracing.workspace = true

# DPAPI, to wrap the local storage key so the files are useless elsewhere.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
] }

[dev-dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
hush-server = { path = "../hush-server" }
axum = "0.8"
uuid = { version = "1", features = ["v4"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
