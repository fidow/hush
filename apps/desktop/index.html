<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hush</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <!-- Arranque -->
    <section id="boot" class="screen">
      <p class="tagline" data-i18n="boot.connecting"></p>
    </section>

    <!-- Registro / inicio de sesión -->
    <section id="login" class="screen hidden">
      <div class="login-card">
        <h1>Hush</h1>
        <p class="tagline" data-i18n="app.tagline"></p>

        <form id="signin-form" class="auth-form">
          <label>
            <span data-i18n="auth.server"></span>
            <select id="signin-server-input" required></select>
            <span id="signin-server-url" class="field-note"></span>
          </label>
          <label>
            <span data-i18n="auth.username"></span>
            <input id="signin-username-input" data-i18n-placeholder="auth.username.placeholder" pattern="[A-Za-z0-9_]{1,32}" required autofocus />
          </label>
          <label>
            <span data-i18n="auth.password"></span>
            <input id="signin-password-input" type="password" required />
          </label>
          <button type="submit" id="signin-btn" data-i18n="auth.signin"></button>
          <p id="signin-error" class="error"></p>
          <button type="button" id="to-forgot" class="switch-link" data-i18n="auth.forgot"></button>
          <p class="hint" data-i18n="auth.signin.note"></p>
          <button type="button" id="to-register" class="switch-link" data-i18n="auth.toRegister"></button>
        </form>

        <form id="login-form" class="auth-form hidden">
          <label>
            <span data-i18n="auth.server"></span>
            <select id="server-input" required></select>
            <span id="server-url" class="field-note"></span>
          </label>
          <label>
            <span data-i18n="auth.username"></span>
            <input id="username-input" data-i18n-placeholder="auth.username.placeholder" pattern="[A-Za-z0-9_]{1,32}" required />
          </label>
          <label>
            <span data-i18n="auth.alias"></span>
            <input id="alias-input" data-i18n-placeholder="auth.alias.placeholder" maxlength="64" required />
          </label>
          <label>
            <span data-i18n="auth.email"></span>
            <input id="email-input" type="email" placeholder="you@example.com" required />
          </label>
          <label>
            <span data-i18n="auth.password"></span>
            <input id="password-input" type="password" minlength="8" data-i18n-placeholder="auth.password.placeholder" required />
          </label>
          <p class="hint" data-i18n="auth.history.note"></p>
          <button type="submit" id="login-btn" data-i18n="auth.register"></button>
          <p id="login-error" class="error"></p>
          <button type="button" id="to-signin" class="switch-link" data-i18n="auth.toSignin"></button>
        </form>

        <label class="lang-picker">
          <span data-i18n="settings.language"></span>
          <select id="lang-input"></select>
        </label>
      </div>
    </section>

    <!-- Recuperar contraseña -->
    <section id="forgot" class="screen hidden">
      <form id="forgot-form" class="login-card">
        <h1>🔑</h1>
        <p class="tagline" data-i18n="forgot.note"></p>
        <label>
          <span data-i18n="auth.server"></span>
          <select id="forgot-server-input" required></select>
          <span id="forgot-server-url" class="field-note"></span>
        </label>
        <label>
          <span data-i18n="auth.username"></span>
          <input id="forgot-username-input" pattern="[A-Za-z0-9_]{1,32}" required />
        </label>

        <div id="forgot-step2" class="auth-form hidden">
          <label>
            <span data-i18n="forgot.code"></span>
            <input id="forgot-code-input" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="000000" />
          </label>
          <label>
            <span data-i18n="forgot.newPassword"></span>
            <input id="forgot-password-input" type="password" minlength="8" data-i18n-placeholder="auth.password.placeholder" />
          </label>
        </div>

        <button type="submit" id="forgot-btn" data-i18n="forgot.send"></button>
        <p id="forgot-error" class="error"></p>
        <p class="hint" data-i18n="forgot.keyNote"></p>
        <button type="button" id="forgot-back" class="switch-link" data-i18n="forgot.back"></button>
      </form>
    </section>

    <!-- Verificación por email -->
    <section id="verify" class="screen hidden">
      <form id="verify-form" class="login-card">
        <h1>📮</h1>
        <p class="tagline" data-i18n="verify.note"></p>
        <label>
          <span data-i18n="verify.code"></span>
          <input id="code-input" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="000000" required />
        </label>
        <button type="submit" id="verify-btn" data-i18n="verify.submit"></button>
        <p id="verify-error" class="error"></p>
      </form>
    </section>

    <!-- Chat -->
    <section id="chat" class="screen hidden">
      <aside class="sidebar">
        <header class="me">
          <button type="button" id="me-status-btn" class="me-status" data-i18n-title="settings.status">
            <!-- Your own portrait, with the presence dot riding on it. -->
            <span id="me-portrait" class="avatar"></span>
            <div class="me-names">
              <span id="me-alias"></span>
              <small id="me-name"></small>
            </div>
            <span class="chevron">▾</span>
          </button>
          <button type="button" id="settings-btn" class="icon-btn" data-i18n-title="chat.settings">⚙</button>
        </header>
        <form id="add-contact-form">
          <input id="add-contact-input" data-i18n-placeholder="chat.addContact" pattern="[A-Za-z0-9_]{1,32}" />
        </form>
        <ul id="contact-list"></ul>
      </aside>
      <main class="conversation no-chat">
        <div id="conn-banner" class="conn-banner hidden" data-i18n="conn.offline"></div>
        <div class="conv-bar">
          <!-- Only shown on a narrow screen, where the two panes take turns. -->
          <button type="button" id="conv-back" class="icon-btn" data-i18n-title="chat.back">‹</button>
          <header id="conv-header">
            <span id="conv-portrait" class="avatar hidden"></span>
            <span id="conv-title" data-i18n="chat.pickContact"></span>
          </header>
        </div>

        <!-- Visible only while no conversation is open. -->
        <div id="conv-empty" class="conv-empty">
          <div class="conv-empty-icon">🔒</div>
          <p id="conv-empty-title" class="conv-empty-title"></p>
          <p id="conv-empty-note" class="conv-empty-note"></p>
        </div>

        <!-- Only while picking messages to delete. -->
        <div id="selection-bar" class="selection-bar hidden">
          <span id="selection-count"></span>
          <div class="selection-actions">
            <button type="button" id="selection-delete" class="mini" data-i18n="select.delete"></button>
            <button type="button" id="selection-cancel" class="mini secondary" data-i18n="select.cancel"></button>
          </div>
        </div>

        <div id="messages"></div>
        <div id="emoji-panel" class="hidden">
          <div id="emoji-tabs"></div>
          <div id="emoji-grid"></div>
        </div>
        <form id="send-form">
          <button type="button" id="emoji-btn" data-i18n-title="chat.emojis" disabled>🙂</button>
          <input id="send-input" data-i18n-placeholder="chat.messagePlaceholder" autocomplete="off" disabled />
          <button type="submit" id="send-btn" data-i18n="chat.send" disabled></button>
        </form>
      </main>
    </section>

    <!-- Ajustes -->
    <div id="settings" class="overlay hidden">
      <form id="settings-form" class="settings-card">
        <header class="settings-header">
          <h2 data-i18n="settings.title"></h2>
          <button type="button" id="settings-close" class="icon-btn" data-i18n-title="settings.close">✕</button>
        </header>
        <div class="avatar-picker">
          <span id="settings-avatar" class="avatar avatar-large"></span>
          <div class="avatar-actions">
            <button type="button" id="avatar-pick" class="secondary" data-i18n="avatar.change"></button>
            <button type="button" id="avatar-clear" class="secondary" data-i18n="avatar.remove"></button>
            <p class="hint" data-i18n="avatar.note"></p>
          </div>
          <input type="file" id="avatar-file" accept="image/*" class="hidden" />
        </div>

        <label>
          <span data-i18n="settings.alias"></span>
          <input id="settings-alias" maxlength="64" required />
        </label>
        <label>
          <span data-i18n="settings.language"></span>
          <select id="settings-lang"></select>
        </label>
        <label>
          <span data-i18n="settings.theme"></span>
          <select id="settings-theme"></select>
        </label>
        <label>
          <span data-i18n="settings.fontSize"></span>
          <select id="settings-font"></select>
        </label>
        <label class="toggle">
          <input type="checkbox" id="settings-notifications" />
          <span data-i18n="settings.notifications"></span>
        </label>
        <!-- Desktop only: Android has no tray, the system owns the lifecycle. -->
        <label class="toggle desktop-only">
          <input type="checkbox" id="settings-tray" />
          <span data-i18n="settings.closeToTray"></span>
        </label>
        <label class="toggle desktop-only">
          <input type="checkbox" id="settings-sound" />
          <span data-i18n="settings.sound"></span>
        </label>
        <!-- On a phone the choice is what the notification itself does, since
             the system is what decides whether it may make a sound at all. -->
        <label class="mobile-only hidden">
          <span data-i18n="settings.alerts"></span>
          <select id="settings-alerts"></select>
        </label>
        <hr />

        <h3 data-i18n="recovery.title"></h3>
        <p class="hint" data-i18n="recovery.note"></p>
        <code id="recovery-code" class="recovery-code">••••••••••••••••</code>
        <div class="recovery-row">
          <button type="button" id="recovery-show" class="secondary" data-i18n="recovery.show"></button>
          <button type="button" id="recovery-copy" class="secondary" data-i18n="recovery.copy"></button>
        </div>

        <h3 data-i18n="devices.title"></h3>
        <p class="hint" data-i18n="devices.note"></p>
        <ul id="device-list" class="device-list"></ul>

        <h3 data-i18n="restore.title"></h3>
        <p class="hint" data-i18n="restore.note"></p>
        <div class="recovery-row">
          <input id="restore-input" data-i18n-placeholder="restore.placeholder" />
          <button type="button" id="restore-btn" data-i18n="restore.action"></button>
        </div>

        <p id="settings-error" class="error"></p>
        <div class="settings-actions">
          <button type="submit" id="settings-save" data-i18n="settings.save"></button>
        </div>

        <hr />

        <h3 data-i18n="about.title"></h3>
        <dl class="info-list">
          <dt data-i18n="about.version"></dt>
          <dd id="about-version">—</dd>
          <dt data-i18n="about.account"></dt>
          <dd id="about-account">—</dd>
          <dt data-i18n="about.server"></dt>
          <dd id="about-server">—</dd>
          <dt data-i18n="about.encryption"></dt>
          <dd id="about-encryption">—</dd>
          <dt data-i18n="about.license"></dt>
          <dd>AGPL-3.0</dd>
          <dt data-i18n="about.website"></dt>
          <dd><a id="about-website" href="#">hush.villasante.es</a></dd>
        </dl>
        <p class="hint" data-i18n="about.note"></p>
      </form>
    </div>

    <!-- Vista previa de imagen pegada -->
    <div id="img-preview" class="overlay hidden">
      <div class="img-preview-card">
        <img id="img-preview-img" data-i18n-title="image.preview" alt="" />
        <div class="img-preview-actions">
          <button type="button" id="img-cancel" class="secondary" data-i18n="image.cancel"></button>
          <button type="button" id="img-send" data-i18n="image.send"></button>
        </div>
      </div>
    </div>

    <!-- Borrar un mensaje: para mí o para todos -->
    <div id="delete-dialog" class="overlay hidden">
      <div class="settings-card confirm-card">
        <header class="settings-header">
          <h2 data-i18n="delete.title"></h2>
          <button type="button" id="delete-close" class="icon-btn" data-i18n-title="settings.close">✕</button>
        </header>
        <p class="hint" id="delete-note"></p>
        <div class="confirm-actions">
          <button type="button" id="delete-mine" data-i18n="delete.forMe" class="secondary"></button>
          <button type="button" id="delete-everyone" data-i18n="delete.forEveryone" class="danger"></button>
        </div>
      </div>
    </div>

    <!-- Confirmar una acción sobre un contacto -->
    <div id="confirm-dialog" class="overlay hidden">
      <div class="settings-card confirm-card">
        <header class="settings-header">
          <h2 id="confirm-title"></h2>
          <button type="button" id="confirm-close" class="icon-btn" data-i18n-title="settings.close">✕</button>
        </header>
        <p class="hint" id="confirm-note"></p>
        <div class="confirm-actions">
          <button type="button" id="confirm-cancel" class="secondary" data-i18n="confirm.cancel"></button>
          <button type="button" id="confirm-ok" class="danger"></button>
        </div>
      </div>
    </div>

    <!-- Información de un mensaje -->
    <div id="msg-info" class="overlay hidden">
      <div class="settings-card info-card">
        <header class="settings-header">
          <h2 data-i18n="info.title"></h2>
          <button type="button" id="info-close" class="icon-btn" data-i18n-title="settings.close">✕</button>
        </header>
        <dl id="info-body" class="info-list"></dl>
      </div>
    </div>

    <!-- Visor de imagen -->
    <div id="img-lightbox" class="overlay hidden">
      <img id="img-lightbox-img" alt="" />
    </div>

    <div id="toast" class="hidden"></div>
  </body>
</html>
